<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #87CEEB; }
    canvas { display: block; }

    #ui {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 28px;
      font-family: Arial, sans-serif;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
      pointer-events: none;
      z-index: 10;
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #overlay.hidden {
      display: none;
    }

    #overlay h1 {
      font-size: 48px;
      font-weight: bold;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
      margin-bottom: 16px;
    }

    #overlay p {
      font-size: 22px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
    }
  </style>
</head>
<body>
  <div id="ui">Score: <span id="score">0</span></div>
  <div id="overlay">
    <h1 id="overlay-title">Flappy 3D</h1>
    <p id="overlay-msg">Press Space or Click to Start</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // ── Scene setup ──────────────────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 0, 8);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(5, 10, 7);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // ── Ground ───────────────────────────────────────────────────────────────
    const groundGeo = new THREE.PlaneGeometry(40, 200);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x5aaf3c });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.set(0, -5.5, -60);
    scene.add(ground);

    // ── Bird ─────────────────────────────────────────────────────────────────
    const birdGroup = new THREE.Group();
    scene.add(birdGroup);

    // Body
    const bodyGeo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
    const bodyMat = new THREE.MeshLambertMaterial({ color: 0xFFD700 });
    const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
    birdGroup.add(bodyMesh);

    // Eye (small black sphere on the front face, z+ side)
    const eyeGeo = new THREE.SphereGeometry(0.07, 8, 8);
    const eyeMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
    const eyeMesh = new THREE.Mesh(eyeGeo, eyeMat);
    eyeMesh.position.set(0.1, 0.08, 0.21);
    birdGroup.add(eyeMesh);

    // ── Game state ───────────────────────────────────────────────────────────
    const GRAVITY    = 0.004;
    const FLAP       = -0.15;
    const PIPE_GAP   = 5.0;
    const PIPE_SPEED = 0.05;
    const SPAWN_MS   = 3000;

    let velocity  = 0;
    let score     = 0;
    let started   = false;
    let gameOver  = false;
    let animId    = null;
    let lastSpawn = 0;

    const pipes = [];   // each entry: { group, gapTop, gapBot, scored }

    const scoreEl        = document.getElementById('score');
    const overlayEl      = document.getElementById('overlay');
    const overlayTitle   = document.getElementById('overlay-title');
    const overlayMsg     = document.getElementById('overlay-msg');

    // ── Pipe factory ─────────────────────────────────────────────────────────
    function makePipeSegment(height) {
      const group = new THREE.Group();

      // Main cylinder
      const cylGeo = new THREE.CylinderGeometry(0.5, 0.5, height, 12);
      const cylMat = new THREE.MeshLambertMaterial({ color: 0x2ecc40 });
      const cyl    = new THREE.Mesh(cylGeo, cylMat);
      group.add(cyl);

      // Cap
      const capGeo = new THREE.CylinderGeometry(0.6, 0.6, 0.3, 12);
      const capMat = new THREE.MeshLambertMaterial({ color: 0x27ae60 });
      const cap    = new THREE.Mesh(capGeo, capMat);
      // Place cap at the inner end of this segment (the end closest to the gap)
      cap.position.y = 0; // will be adjusted by caller
      group.add(cap);

      return { group, cap };
    }

    function spawnPipe() {
      const yOffset = (Math.random() - 0.5) * 0.4;  // -0.2 to +0.2 (nearly centered)
      const gapTop  = yOffset + PIPE_GAP / 2;
      const gapBot  = yOffset - PIPE_GAP / 2;

      const pipeGroup = new THREE.Group();
      pipeGroup.position.set(0, 0, -6);
      scene.add(pipeGroup);

      // ── Top pipe (hangs down from above) ──────────────────────────────────
      const topHeight = 8;
      const { group: topGroup, cap: topCap } = makePipeSegment(topHeight);
      // Center of top cylinder sits topHeight/2 above gapTop
      topGroup.position.y = gapTop + topHeight / 2;
      // Cap at the bottom of the top pipe (toward the gap)
      topCap.position.y = -topHeight / 2;
      pipeGroup.add(topGroup);

      // ── Bottom pipe (rises from below) ────────────────────────────────────
      const botHeight = 8;
      const { group: botGroup, cap: botCap } = makePipeSegment(botHeight);
      botGroup.position.y = gapBot - botHeight / 2;
      // Cap at the top of the bottom pipe (toward the gap)
      botCap.position.y = botHeight / 2;
      pipeGroup.add(botGroup);

      pipes.push({ group: pipeGroup, gapTop, gapBot, scored: false });
    }

    // ── Input ─────────────────────────────────────────────────────────────────
    function handleInput() {
      if (gameOver) return;
      if (!started) {
        started = true;
        lastSpawn = performance.now();
        overlayEl.classList.add('hidden');
      }
      velocity = FLAP;
    }

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        if (gameOver) {
          restartGame();
        } else {
          handleInput();
        }
      }
    });

    document.addEventListener('click', () => {
      if (gameOver) {
        restartGame();
      } else {
        handleInput();
      }
    });

    // ── Resize ────────────────────────────────────────────────────────────────
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ── Game over / restart ───────────────────────────────────────────────────
    function triggerGameOver() {
      gameOver = true;
      cancelAnimationFrame(animId);
      animId = null;

      overlayTitle.textContent = 'GAME OVER — Score: ' + score;
      overlayMsg.textContent   = 'Press Space or Click to Restart';
      overlayEl.classList.remove('hidden');
    }

    function restartGame() {
      // Remove all pipes from scene
      for (const p of pipes) {
        scene.remove(p.group);
      }
      pipes.length = 0;

      // Reset bird
      birdGroup.position.set(0, 0, 0);
      birdGroup.rotation.z = 0;
      velocity  = 0;
      score     = 0;
      started   = false;
      gameOver  = false;

      scoreEl.textContent = '0';

      // Hide overlay, show start message (reuse overlay for start hint)
      overlayTitle.textContent = 'Flappy 3D';
      overlayMsg.textContent   = 'Press Space or Click to Start';
      overlayEl.classList.remove('hidden');

      // Spawn first pipe
      spawnPipe();
      lastSpawn = performance.now();

      // Restart loop
      if (animId !== null) cancelAnimationFrame(animId);
      animId = requestAnimationFrame(loop);
    }

    // ── Animation loop ────────────────────────────────────────────────────────
    let prevTime = performance.now();
    function loop(now) {
      animId = requestAnimationFrame(loop);

      // Delta-time multiplier relative to 60fps so physics are frame-rate independent
      const dt = Math.min((now - prevTime) / (1000 / 60), 3);
      prevTime = now;

      if (started && !gameOver) {
        // Physics (scaled by dt)
        velocity += GRAVITY * dt;
        birdGroup.position.y -= velocity * dt;

        // Tilt
        birdGroup.rotation.z = Math.max(-0.5, Math.min(0.5, -velocity * 2));

        // Spawn pipes
        if (now - lastSpawn >= SPAWN_MS) {
          spawnPipe();
          lastSpawn = now;
        }

        // Move & check pipes
        for (let i = pipes.length - 1; i >= 0; i--) {
          const p = pipes[i];
          p.group.position.z += PIPE_SPEED * dt;

          // Score
          if (!p.scored && p.group.position.z > 1) {
            p.scored = true;
            score++;
            scoreEl.textContent = score;
          }

          // Remove old pipes
          if (p.group.position.z > 7) {
            scene.remove(p.group);
            pipes.splice(i, 1);
            continue;
          }

          // Collision with pipes
          const pz = p.group.position.z;
          if (pz > -1.5 && pz < 1.5) {
            const bx = birdGroup.position.x;
            const by = birdGroup.position.y;
            if (Math.abs(bx) < 0.85) {
              if (by > p.gapTop + 0.2 || by < p.gapBot - 0.2) {
                triggerGameOver();
                return;
              }
            }
          }
        }

        // Boundary collision
        if (birdGroup.position.y > 6 || birdGroup.position.y < -6) {
          triggerGameOver();
          return;
        }
      }

      renderer.render(scene, camera);
    }

    // ── Init ──────────────────────────────────────────────────────────────────
    spawnPipe();
    lastSpawn = performance.now();
    animId = requestAnimationFrame(loop);
    // Overlay starts visible with "Press Space or Click to Start"
    overlayEl.classList.remove('hidden');
  </script>
</body>
</html>
