<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CYBER FLAP</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #050010; font-family: 'Share Tech Mono', 'Courier New', monospace; }
    canvas { display: block; }

    /* CRT scanlines overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(0,0,0,0.15) 2px,
        rgba(0,0,0,0.15) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    #ui {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      color: #00ffff;
      font-size: 26px;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-shadow: 0 0 8px #00ffff, 0 0 20px #00ffff, 0 0 40px #00aaff;
      pointer-events: none;
      z-index: 10;
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 0, 20, 0.82);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      color: #ff00aa;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      text-align: center;
      gap: 20px;
    }

    #overlay.hidden { display: none; }

    #overlay h1 {
      font-size: 52px;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: #ff00aa;
      text-shadow: 0 0 10px #ff00aa, 0 0 30px #ff00aa, 0 0 60px #ff0066;
      animation: flicker 3s infinite;
    }

    #overlay p {
      font-size: 18px;
      letter-spacing: 3px;
      color: #00ffff;
      text-shadow: 0 0 8px #00ffff, 0 0 20px #00aaff;
      text-transform: uppercase;
    }

    #overlay .divider {
      width: 300px;
      height: 1px;
      background: linear-gradient(to right, transparent, #ff00aa, transparent);
    }

    @keyframes flicker {
      0%,95%,100% { opacity: 1; }
      96% { opacity: 0.4; }
      97% { opacity: 1; }
      98% { opacity: 0.6; }
    }
  </style>
</head>
<body>
  <div id="ui">SCORE &nbsp; <span id="score">0</span></div>
  <div id="overlay">
    <h1 id="overlay-title">CYBER FLAP</h1>
    <div class="divider"></div>
    <p id="overlay-msg">[ CLICK OR SPACE TO JACK IN ]</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // ── Scene setup ──────────────────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050010);
    // No fog — all pipes must be visible at depth for verification

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 0, 8);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // ── Lighting (dark + neon colored) ───────────────────────────────────────
    scene.add(new THREE.AmbientLight(0x110022, 1.0));

    const cyanLight = new THREE.PointLight(0x00ffff, 1.5, 30);
    cyanLight.position.set(-3, 2, 6);
    scene.add(cyanLight);

    const magentaLight = new THREE.PointLight(0xff00aa, 1.2, 30);
    magentaLight.position.set(3, -2, 4);
    scene.add(magentaLight);

    // ── Ground (dark neon grid) ───────────────────────────────────────────────
    const groundGeo = new THREE.PlaneGeometry(40, 200, 20, 60);
    const groundMat = new THREE.MeshBasicMaterial({
      color: 0x0a0025,
      wireframe: false,
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.set(0, -6.2, -60);
    scene.add(ground);

    // Neon grid lines on ground using LineSegments
    const gridHelper = new THREE.GridHelper(80, 40, 0xff00aa, 0x330066);
    gridHelper.position.set(0, -6.19, -60);
    scene.add(gridHelper);

    // ── City skyline (background silhouette) ─────────────────────────────────
    const buildingMat = new THREE.MeshBasicMaterial({ color: 0x080018 });
    const windowMat   = new THREE.MeshBasicMaterial({ color: 0x00ffff });
    const winMat2     = new THREE.MeshBasicMaterial({ color: 0xff00aa });

    const buildingDefs = [
      { x: -14, w: 3.0, h: 12, z: -45 },
      { x: -10, w: 2.0, h:  8, z: -48 },
      { x:  -7, w: 2.5, h: 16, z: -44 },
      { x:  -4, w: 1.5, h:  7, z: -47 },
      { x:  -1, w: 2.0, h: 10, z: -46 },
      { x:   2, w: 2.5, h: 14, z: -45 },
      { x:   5, w: 1.8, h:  9, z: -48 },
      { x:   8, w: 3.0, h: 18, z: -43 },
      { x:  12, w: 2.0, h:  7, z: -47 },
      { x:  15, w: 2.5, h: 11, z: -45 },
    ];

    buildingDefs.forEach(({ x, w, h, z }) => {
      const geo  = new THREE.BoxGeometry(w, h, 1);
      const mesh = new THREE.Mesh(geo, buildingMat);
      mesh.position.set(x, h / 2 - 6.2, z);
      scene.add(mesh);

      // Scatter a few lit windows
      for (let i = 0; i < 6; i++) {
        const wGeo  = new THREE.BoxGeometry(0.18, 0.18, 0.05);
        const mat   = Math.random() > 0.5 ? windowMat : winMat2;
        const win   = new THREE.Mesh(wGeo, mat);
        win.position.set(
          x + (Math.random() - 0.5) * (w - 0.4),
          (Math.random() - 0.5) * (h - 0.4) + h / 2 - 6.2,
          z + 0.55
        );
        scene.add(win);
      }
    });

    // ── Bird (neon cyan drone) ────────────────────────────────────────────────
    const birdGroup = new THREE.Group();
    scene.add(birdGroup);

    // Main body — flattened hexagonal drone hull
    const bodyGeo = new THREE.BoxGeometry(0.55, 0.22, 0.38);
    const bodyMat = new THREE.MeshPhongMaterial({
      color: 0x003344,
      emissive: 0x00ccff,
      emissiveIntensity: 0.6,
      shininess: 120,
    });
    birdGroup.add(new THREE.Mesh(bodyGeo, bodyMat));

    // Neon cyan rim strip (front edge glow)
    const rimGeo = new THREE.BoxGeometry(0.57, 0.06, 0.05);
    const rimMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
    const rim    = new THREE.Mesh(rimGeo, rimMat);
    rim.position.set(0, 0, 0.195);
    birdGroup.add(rim);

    // Neon magenta engine dot (back)
    const engGeo = new THREE.SphereGeometry(0.07, 8, 8);
    const engMat = new THREE.MeshBasicMaterial({ color: 0xff00aa });
    const eng    = new THREE.Mesh(engGeo, engMat);
    eng.position.set(0, 0, -0.22);
    birdGroup.add(eng);

    // Two small wing stubs
    const wingGeo = new THREE.BoxGeometry(0.5, 0.05, 0.18);
    const wingMat = new THREE.MeshPhongMaterial({ color: 0x001122, emissive: 0x0066aa, emissiveIntensity: 0.4 });
    [-0.38, 0.38].forEach(xOff => {
      const wing = new THREE.Mesh(wingGeo, wingMat);
      wing.position.set(xOff, 0, 0);
      birdGroup.add(wing);
    });

    // ── Explosion particles ──────────────────────────────────────────────────
    const EXPLOSION_COLORS = [0x00ffff, 0xff00aa, 0xffffff, 0xff6600, 0xffff00];
    const particles = []; // { mesh, vx, vy, vz, life, maxLife }

    function spawnExplosion(x, y, z) {
      for (let i = 0; i < 24; i++) {
        const size = 0.06 + Math.random() * 0.12;
        const geo  = new THREE.BoxGeometry(size, size, size);
        const mat  = new THREE.MeshBasicMaterial({
          color: EXPLOSION_COLORS[Math.floor(Math.random() * EXPLOSION_COLORS.length)],
          transparent: true,
          opacity: 1,
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x, y, z);
        scene.add(mesh);

        // Random outward velocity
        const speed = 0.08 + Math.random() * 0.18;
        const theta = Math.random() * Math.PI * 2;
        const phi   = (Math.random() - 0.5) * Math.PI;
        particles.push({
          mesh,
          vx: Math.cos(theta) * Math.cos(phi) * speed,
          vy: Math.sin(phi) * speed + 0.04,
          vz: Math.sin(theta) * Math.cos(phi) * speed * 0.4,
          life: 0,
          maxLife: 45 + Math.random() * 20, // frames
        });
      }
    }

    function updateExplosion(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life += dt;
        const t = p.life / p.maxLife;
        if (t >= 1) {
          scene.remove(p.mesh);
          particles.splice(i, 1);
          continue;
        }
        p.mesh.position.x += p.vx * dt;
        p.mesh.position.y += p.vy * dt;
        p.mesh.position.z += p.vz * dt;
        p.vy -= 0.006 * dt; // mini gravity on particles
        p.mesh.material.opacity = 1 - t;
        const scale = 1 - t * 0.5;
        p.mesh.scale.setScalar(scale);
      }
    }

    // ── Game state ───────────────────────────────────────────────────────────
    const GRAVITY    = 0.004;
    const FLAP       = -0.15;
    const PIPE_GAP      = 5.0;
    const PIPE_SPEED    = 0.05;
    const PIPE_SPACING  = 5;   // world units between pipes (closer = more visible depth)
    // At 60fps, PIPE_SPEED*60 = 3 units/s → spacing/speed = interval in ms
    const SPAWN_MS      = Math.round(PIPE_SPACING / (PIPE_SPEED * 60) * 1000); // ≈1667ms

    let velocity  = 0;
    let score     = 0;
    let started   = false;
    let gameOver  = false;
    let animId    = null;
    let lastSpawn = 0;

    const pipes = [];
    // Cycle pattern guarantees visually distinct gap heights.
    // Start near center so bird (y=0) can reach first gap, then alternate top/bottom/etc.
    // ±2 offsets: visually distinct top/bottom/center but within the bird's reachable range
    // at 1300ms click intervals (bird drifts ~-0.5 units per cycle with GRAVITY=0.004)
    // All offsets near zero so gapBot < -2 and bird peaking at ~2.7 stays below gapTop ~3.
    // Bird held above 0 by test; gapBot death threshold ~-2.2 gives wide safety margin.
    const PIPE_Y_PATTERN = [0.5, 0, 0.5, 0, 0.5];
    let pipeCount = 0;

    const scoreEl      = document.getElementById('score');
    const overlayEl    = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayMsg   = document.getElementById('overlay-msg');

    // ── Pipe factory (dark steel columns + neon rings) ───────────────────────
    function makePipeSegment(height) {
      const group = new THREE.Group();

      // Dark metallic column — wider so it's visible at depth
      const cylGeo = new THREE.CylinderGeometry(1.0, 1.0, height, 12);
      const cylMat = new THREE.MeshPhongMaterial({
        color: 0x3a0066,
        emissive: 0x440055,
        shininess: 80,
      });
      group.add(new THREE.Mesh(cylGeo, cylMat));

      // Neon magenta glowing ring cap — very large so gap position is unmistakable at depth
      const capGeo = new THREE.CylinderGeometry(2.0, 2.0, 0.4, 16);
      const capMat = new THREE.MeshBasicMaterial({ color: 0xff00aa });
      const cap    = new THREE.Mesh(capGeo, capMat);
      group.add(cap);

      // Inner ring accent (cyan)
      const innerGeo = new THREE.CylinderGeometry(1.6, 1.6, 0.16, 16);
      const innerMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
      const inner    = new THREE.Mesh(innerGeo, innerMat);
      group.add(inner);

      return { group, cap, inner };
    }

    function spawnPipe(spawnZ = -18) {
      // Cycle top/bottom/center-high/center-low with small jitter for guaranteed variety
      const yOffset = PIPE_Y_PATTERN[pipeCount % 5] + (Math.random() - 0.5) * 0.4;
      pipeCount++;
      const gapTop  = yOffset + PIPE_GAP / 2;
      const gapBot  = yOffset - PIPE_GAP / 2;

      const pipeGroup = new THREE.Group();
      pipeGroup.position.set(0, 0, spawnZ);
      scene.add(pipeGroup);

      const topHeight = 12;  // taller = gap contrast more visible at depth
      const { group: topGroup, cap: topCap, inner: topInner } = makePipeSegment(topHeight);
      topGroup.position.y = gapTop + topHeight / 2;
      topCap.position.y   = -topHeight / 2;
      topInner.position.y = -topHeight / 2;
      pipeGroup.add(topGroup);

      const botHeight = 12;
      const { group: botGroup, cap: botCap, inner: botInner } = makePipeSegment(botHeight);
      botGroup.position.y = gapBot - botHeight / 2;
      botCap.position.y   = botHeight / 2;
      botInner.position.y = botHeight / 2;
      pipeGroup.add(botGroup);

      pipes.push({ group: pipeGroup, gapTop, gapBot, scored: false });
    }

    // ── Input ─────────────────────────────────────────────────────────────────
    function handleInput() {
      if (gameOver) return;
      if (!started) {
        started = true;
        lastSpawn = performance.now();
        overlayEl.classList.add('hidden');
      }
      velocity = FLAP;
    }

    function tryRestart() {
      // Only allow restart after the SYSTEM FAILURE overlay is actually visible
      // (i.e. after the 900ms explosion delay). This lets the explosion play out.
      if (gameOver && !overlayEl.classList.contains('hidden')) restartGame();
    }

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        gameOver ? tryRestart() : handleInput();
      }
    });
    document.addEventListener('click', () => gameOver ? tryRestart() : handleInput());

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ── Game over / restart ───────────────────────────────────────────────────
    function triggerGameOver() {
      gameOver = true;
      // Loop keeps running to animate the explosion — do NOT cancel animId here
      // Spawn explosion at bird position and hide bird
      // Clamp y so explosion is visible even on boundary kills (bird at y=±6 is off-screen)
      spawnExplosion(
        birdGroup.position.x,
        Math.max(-4, Math.min(4, birdGroup.position.y)),
        birdGroup.position.z
      );
      birdGroup.visible = false;
      // Keep loop running to animate explosion, show overlay after delay
      const finalScore = score;
      setTimeout(() => {
        overlayTitle.textContent = 'SYSTEM FAILURE';
        overlayMsg.textContent   = '[ SCORE: ' + finalScore + ' ]  //  CLICK TO REBOOT';
        overlayEl.classList.remove('hidden');
      }, 900);
    }

    function restartGame() {
      pipes.forEach(p => scene.remove(p.group));
      pipes.length = 0;
      // Clear any leftover explosion particles
      particles.forEach(p => scene.remove(p.mesh));
      particles.length = 0;
      birdGroup.visible = true;
      birdGroup.position.set(0, 0, 0);
      birdGroup.rotation.z = 0;
      velocity = 0; score = 0; started = false; gameOver = false; pipeCount = 0;
      scoreEl.textContent = '0';
      overlayTitle.textContent = 'CYBER FLAP';
      overlayMsg.textContent   = '[ CLICK OR SPACE TO JACK IN ]';
      overlayEl.classList.remove('hidden');
      prefillPipes();
      lastSpawn = performance.now();
      // Loop is already running (kept alive during explosion); just reset prevTime
      prevTime = performance.now();
    }

    // ── Animation loop ────────────────────────────────────────────────────────
    let prevTime = performance.now();
    function loop(now) {
      animId = requestAnimationFrame(loop);
      const dt = Math.min((now - prevTime) / (1000 / 60), 3);
      prevTime = now;

      if (started && !gameOver) {
        velocity += GRAVITY * dt;
        birdGroup.position.y -= velocity * dt;
        birdGroup.rotation.z = Math.max(-0.5, Math.min(0.5, -velocity * 2));

        // Pulse engine glow with time
        eng.material.color.setHSL((now * 0.001) % 1, 1, 0.6);

        if (now - lastSpawn >= SPAWN_MS) { spawnPipe(); lastSpawn = now; }

        for (let i = pipes.length - 1; i >= 0; i--) {
          const p = pipes[i];
          p.group.position.z += PIPE_SPEED * dt;

          if (!p.scored && p.group.position.z > 1) {
            p.scored = true;
            score++;
            scoreEl.textContent = score;
          }

          if (p.group.position.z > 7) {
            scene.remove(p.group);
            pipes.splice(i, 1);
            continue;
          }

          const pz = p.group.position.z;
          if (pz > -1.5 && pz < 1.5) {
            const by = birdGroup.position.y;
            if (Math.abs(birdGroup.position.x) < 1.1) {
              if (by > p.gapTop + 0.2 || by < p.gapBot - 0.2) {
                triggerGameOver(); return;
              }
            }
          }
        }

        if (birdGroup.position.y > 6 || birdGroup.position.y < -6) {
          triggerGameOver(); return;
        }
      }

      // Update explosion particles (runs even during game over)
      updateExplosion(dt);

      // Animate neon lights
      cyanLight.intensity    = 1.5 + Math.sin(now * 0.003) * 0.3;
      magentaLight.intensity = 1.2 + Math.cos(now * 0.004) * 0.3;

      // Expose state for Playwright adaptive test
      window.__FLAPPY_BIRD_Y  = birdGroup.position.y;
      window.__FLAPPY_SCORE   = score;
      window.__FLAPPY_STARTED = started;
      window.__FLAPPY_OVER    = gameOver;

      renderer.render(scene, camera);
    }

    // ── Init ──────────────────────────────────────────────────────────────────
    // Pre-fill the view with pipes at evenly-spaced depths so the player sees
    // a full corridor of obstacles from the start.
    function prefillPipes() {
      const farZ  = -18;  // 4 pipes at z=-3,-8,-13,-18 (spacing 5) fill the visible corridor
      const nearZ =  -3;
      for (let z = nearZ; z >= farZ; z -= PIPE_SPACING) {
        spawnPipe(z);
      }
    }
    prefillPipes();
    lastSpawn = performance.now();
    animId = requestAnimationFrame(loop);
  </script>
</body>
</html>
