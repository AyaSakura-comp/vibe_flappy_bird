<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CYBER FLAP</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #050010; font-family: 'Share Tech Mono', 'Courier New', monospace; }
    canvas { display: block; }

    /* CRT scanlines overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(0,0,0,0.15) 2px,
        rgba(0,0,0,0.15) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    #ui {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      color: #00ffff;
      font-size: 26px;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-shadow: 0 0 8px #00ffff, 0 0 20px #00ffff, 0 0 40px #00aaff;
      pointer-events: none;
      z-index: 10;
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 0, 20, 0.82);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      color: #ff00aa;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      text-align: center;
      gap: 20px;
    }

    #overlay.hidden { display: none; }

    #overlay h1 {
      font-size: 52px;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: #ff00aa;
      text-shadow: 0 0 10px #ff00aa, 0 0 30px #ff00aa, 0 0 60px #ff0066;
      animation: flicker 3s infinite;
    }

    #overlay p {
      font-size: 18px;
      letter-spacing: 3px;
      color: #00ffff;
      text-shadow: 0 0 8px #00ffff, 0 0 20px #00aaff;
      text-transform: uppercase;
    }

    #overlay .divider {
      width: 300px;
      height: 1px;
      background: linear-gradient(to right, transparent, #ff00aa, transparent);
    }

    @keyframes flicker {
      0%,95%,100% { opacity: 1; }
      96% { opacity: 0.4; }
      97% { opacity: 1; }
      98% { opacity: 0.6; }
    }
  </style>
</head>
<body>
  <div id="ui">SCORE &nbsp; <span id="score">0</span></div>
  <div id="overlay">
    <h1 id="overlay-title">CYBER FLAP</h1>
    <div class="divider"></div>
    <p id="overlay-msg">[ CLICK OR SPACE TO JACK IN ]</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script type="module" src="js/game.js"></script>
</body>
</html>
