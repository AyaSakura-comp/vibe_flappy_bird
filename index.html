<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CYBER FLAP</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #050010; font-family: 'Share Tech Mono', 'Courier New', monospace; touch-action: none; }
    canvas { display: block; }

    /* CRT scanlines overlay */

    #ui {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      color: #00ffff;
      font-size: 26px;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-shadow: 0 0 8px #00ffff, 0 0 20px #00ffff, 0 0 40px #00aaff;
      pointer-events: none;
      z-index: 10;
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 0, 20, 0.82);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      color: #ff00aa;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      text-align: center;
      gap: 20px;
    }

    #overlay.hidden { display: none; }

    #overlay h1 {
      font-size: 52px;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: #ff00aa;
      text-shadow: 0 0 10px #ff00aa, 0 0 30px #ff00aa, 0 0 60px #ff0066;
      animation: flicker 3s infinite;
    }

    #overlay p {
      font-size: 18px;
      letter-spacing: 3px;
      color: #00ffff;
      text-shadow: 0 0 8px #00ffff, 0 0 20px #00aaff;
      text-transform: uppercase;
    }

    #overlay .divider {
      width: 300px;
      height: 1px;
      background: linear-gradient(to right, transparent, #ff00aa, transparent);
    }

    @keyframes flicker {
      0%,95%,100% { opacity: 1; }
      96% { opacity: 0.4; }
      97% { opacity: 1; }
      98% { opacity: 0.6; }
    }

    #phase-hud {
      display: none;
      position: fixed;
      bottom: calc(40px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
    }
    #phase-bar-container {
      width: 120px;
      height: 8px;
      border: 1px solid rgba(0, 255, 255, 0.4);
      background: rgba(0, 0, 0, 0.5);
      border-radius: 4px;
      overflow: hidden;
    }
    #phase-bar-fill {
      height: 100%;
      width: 100%;
      background: #00ffff;
      transition: width 0.1s linear, background-color 0.3s;
      box-shadow: 0 0 8px #00ffff;
    }
    #input-hints {
      position: fixed;
      bottom: calc(60px + env(safe-area-inset-bottom, 0px));
      left: 0; right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      z-index: 15;
      pointer-events: none;
      opacity: 0.4;
    }
    #input-hints .hint-left, #input-hints .hint-right {
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      letter-spacing: 2px;
      color: #00ffff;
      text-shadow: 0 0 6px #00ffff;
    }
    #input-hints .hint-divider {
      width: 1px;
      height: 30px;
      background: rgba(0, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <div id="ui">SCORE &nbsp; <span id="score">0</span></div>
  <div id="overlay">
    <h1 id="overlay-title">CYBER FLAP</h1>
    <div class="divider"></div>
    <p id="overlay-msg">[ CLICK, TAP OR SPACE TO JACK IN ]</p>
  </div>
  <div id="phase-hud">
    <div id="phase-bar-container">
      <div id="phase-bar-fill"></div>
    </div>
  </div>
  <div id="input-hints">
    <span class="hint-left">CLICK/TAP TO JUMP</span>
    <div class="hint-divider"></div>
    <span class="hint-right">HOLD TO PHASE</span>
  </div>

  <script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
    "three/examples/jsm/postprocessing/EffectComposer.js": "https://unpkg.com/three@0.128.0/examples/jsm/postprocessing/EffectComposer.js",
    "three/examples/jsm/postprocessing/RenderPass.js": "https://unpkg.com/three@0.128.0/examples/jsm/postprocessing/RenderPass.js",
    "three/examples/jsm/postprocessing/UnrealBloomPass.js": "https://unpkg.com/three@0.128.0/examples/jsm/postprocessing/UnrealBloomPass.js",
    "three/examples/jsm/postprocessing/ShaderPass.js": "https://unpkg.com/three@0.128.0/examples/jsm/postprocessing/ShaderPass.js",
    "three/examples/jsm/shaders/CopyShader.js": "https://unpkg.com/three@0.128.0/examples/jsm/shaders/CopyShader.js",
    "three/examples/jsm/shaders/LuminosityHighPassShader.js": "https://unpkg.com/three@0.128.0/examples/jsm/shaders/LuminosityHighPassShader.js",
    "three/examples/jsm/shaders/FilmShader.js": "https://unpkg.com/three@0.128.0/examples/jsm/shaders/FilmShader.js",
    "three/examples/jsm/shaders/VignetteShader.js": "https://unpkg.com/three@0.128.0/examples/jsm/shaders/VignetteShader.js"
  }
}
</script>
  <script type="module" src="js/game.js"></script>
</body>
</html>
